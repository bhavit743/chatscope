<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Truth or Lie? 🤔</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d1a;
    --card: #1c1c38;
    --border: rgba(124,58,237,0.2);
    --purple: #7c3aed;
    --purple-light: #a855f7;
    --amber: #f59e0b;
    --green: #10b981;
    --red: #ef4444;
    --text: #f1f5f9;
    --muted: #94a3b8;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 20px 48px;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at 30% 0%, rgba(124,58,237,0.1) 0%, transparent 60%);
    pointer-events: none;
  }

  .wrap { width: 100%; max-width: 540px; position: relative; z-index: 1; }

  /* HEADER */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 28px;
  }
  .logo {
    font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 800;
  }
  .logo em { font-style: normal; color: var(--purple-light); }
  .score-chip {
    font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700;
    background: rgba(124,58,237,0.12); border: 1px solid rgba(124,58,237,0.25);
    color: var(--purple-light); padding: 6px 14px; border-radius: 20px;
  }

  /* CATEGORY PILLS */
  .cat-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 10px; }
  .cats {
    display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px;
  }
  .cat-btn {
    padding: 8px 16px; border-radius: 20px; border: 1.5px solid rgba(255,255,255,0.1);
    background: transparent; color: var(--muted); cursor: pointer;
    font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500;
    transition: all 0.15s;
  }
  .cat-btn:hover { border-color: var(--purple); color: var(--text); }
  .cat-btn.active {
    background: var(--purple); border-color: var(--purple);
    color: #fff; font-weight: 600;
  }

  /* FACT CARD */
  .fact-card {
    background: var(--card); border: 1.5px solid var(--border);
    border-radius: 24px; padding: 28px 24px; margin-bottom: 20px;
    min-height: 180px; display: flex; flex-direction: column; justify-content: center;
    transition: border-color 0.4s;
    position: relative; overflow: hidden;
  }
  .fact-card.correct { border-color: rgba(16,185,129,0.6); }
  .fact-card.wrong   { border-color: rgba(239,68,68,0.6); }
  .fact-card::before {
    content: '';
    position: absolute; top: -40px; right: -40px;
    width: 160px; height: 160px; border-radius: 50%;
    background: radial-gradient(circle, rgba(124,58,237,0.1) 0%, transparent 70%);
    pointer-events: none;
  }
  .fact-emoji { font-size: 40px; margin-bottom: 14px; }
  .fact-text {
    font-family: 'Syne', sans-serif; font-size: clamp(17px, 4vw, 22px);
    font-weight: 700; line-height: 1.45; color: var(--text);
  }
  .fact-cat {
    display: inline-block; margin-top: 14px;
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--purple-light); background: rgba(124,58,237,0.1);
    padding: 4px 10px; border-radius: 20px;
  }

  /* VOTE BUTTONS */
  .vote-row {
    display: flex; gap: 12px; margin-bottom: 16px;
  }
  .btn-vote {
    flex: 1; padding: 18px; border-radius: 16px; border: none; cursor: pointer;
    font-family: 'Syne', sans-serif; font-weight: 800; font-size: 18px;
    transition: transform 0.12s, box-shadow 0.2s, opacity 0.2s;
  }
  .btn-vote:active { transform: scale(0.95); }
  .btn-truth {
    background: var(--green); color: #fff;
    box-shadow: 0 0 28px rgba(16,185,129,0.25);
  }
  .btn-truth:hover { box-shadow: 0 0 44px rgba(16,185,129,0.45); }
  .btn-lie {
    background: var(--red); color: #fff;
    box-shadow: 0 0 28px rgba(239,68,68,0.25);
  }
  .btn-lie:hover { box-shadow: 0 0 44px rgba(239,68,68,0.45); }
  .btn-vote.dimmed { opacity: 0.35; transform: scale(0.97); cursor: default; }
  .btn-vote.chosen { transform: scale(1.03); }

  /* REVEAL PANEL */
  .reveal-panel {
    display: none;
    background: var(--card); border: 1.5px solid var(--border);
    border-radius: 20px; padding: 20px 22px; margin-bottom: 16px;
    animation: slideUp 0.35s cubic-bezier(0.34,1.4,0.64,1);
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(16px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .reveal-panel.show { display: block; }
  .verdict {
    font-family: 'Syne', sans-serif; font-size: 26px; font-weight: 800;
    margin-bottom: 10px;
  }
  .verdict.v-correct { color: var(--green); }
  .verdict.v-wrong   { color: var(--red); }
  .verdict.v-neutral { color: var(--amber); }
  .explanation {
    font-size: 14px; color: var(--muted); line-height: 1.65;
    border-left: 3px solid var(--purple); padding-left: 14px;
  }

  /* NEXT BUTTON */
  .btn-next {
    width: 100%; padding: 16px; border-radius: 16px; border: none; cursor: pointer;
    font-family: 'Syne', sans-serif; font-weight: 700; font-size: 16px;
    background: var(--purple); color: #fff;
    box-shadow: 0 0 28px rgba(124,58,237,0.3);
    transition: box-shadow 0.2s, transform 0.12s;
    display: none;
  }
  .btn-next:hover { box-shadow: 0 0 44px rgba(124,58,237,0.5); }
  .btn-next:active { transform: scale(0.97); }
  .btn-next.show { display: block; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* COUNTER */
  .counter {
    text-align: center; font-size: 13px; color: var(--muted); margin-top: 16px;
  }
  .counter strong { color: var(--text); }

  @media (max-width: 400px) {
    .btn-vote { font-size: 16px; padding: 16px 10px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="logo">Truth or <em>Lie?</em> 🤔</div>
    <div class="score-chip" id="scoreChip">0 / 0</div>
  </div>

  <div class="cat-label">Pick a category</div>
  <div class="cats" id="cats"></div>

  <div class="fact-card" id="factCard">
    <div class="fact-emoji" id="factEmoji">🎲</div>
    <div class="fact-text" id="factText">Tap a category above to start!</div>
    <span class="fact-cat" id="factCat" style="display:none"></span>
  </div>

  <div class="vote-row" id="voteRow">
    <button class="btn-vote btn-truth" id="btnTruth" onclick="vote(true)">✅ Truth</button>
    <button class="btn-vote btn-lie"   id="btnLie"   onclick="vote(false)">❌ Lie</button>
  </div>

  <div class="reveal-panel" id="revealPanel">
    <div class="verdict" id="verdict"></div>
    <div class="explanation" id="explanation"></div>
  </div>

  <button class="btn-next" id="btnNext" onclick="nextFact()">Next Fact →</button>

  <div class="counter" id="counter"></div>

</div>

<script>
const FACTS = [
  // ── ANIMALS ──
  { s:"Wombat poop is perfectly cube-shaped. It's the only animal in the world that produces cube-shaped droppings.", isTrue:true,  emoji:"🐨", cat:"Animals", exp:"Wombats produce about 80–100 cubes per night. Scientists discovered their elastic intestines create this shape so droppings stack on rocks and don't roll away." },
  { s:"Otters hold hands while sleeping so they don't drift apart from each other.", isTrue:true,  emoji:"🦦", cat:"Animals", exp:"This is called 'rafting'. They also wrap themselves in kelp as an anchor. Real, adorable, and scientifically documented." },
  { s:"Scotland's official national animal is a unicorn.", isTrue:true,  emoji:"🦄", cat:"Animals", exp:"Since the 12th century! The unicorn symbolised power and independence in Celtic mythology. Scotland committed to the bit fully." },
  { s:"A group of flamingos is officially called a 'flamboyance'.", isTrue:true,  emoji:"🦩", cat:"Animals", exp:"It's also called a stand or colony, but flamboyance is the official term. Perfectly on brand for flamingos." },
  { s:"Butterflies taste everything they land on — including your skin — with their feet.", isTrue:true,  emoji:"🦋", cat:"Animals", exp:"They have chemoreceptors on their feet, 200 times more sensitive than a human tongue. Hope you taste good." },
  { s:"Sloths can hold their breath longer than dolphins — up to 40 minutes.", isTrue:true,  emoji:"🦥", cat:"Animals", exp:"By slowing their metabolism, sloths can hold their breath for up to 40 minutes. Dolphins max out around 10–15 minutes." },
  { s:"Male seahorses are the ones who get pregnant and give birth.", isTrue:true,  emoji:"🐠", cat:"Animals", exp:"The female deposits eggs into a brood pouch on the male's belly. He carries them for 2–4 weeks and gives birth to hundreds of tiny seahorses." },
  { s:"An octopus has three hearts and its blood is blue.", isTrue:true,  emoji:"🐙", cat:"Animals", exp:"Two hearts pump blood to the gills, one to the body. Their blood uses hemocyanin (copper-based) instead of hemoglobin, making it blue." },
  { s:"Crows can recognise individual human faces and hold grudges against people who upset them.", isTrue:true,  emoji:"🐦‍⬛", cat:"Animals", exp:"Studies show crows not only recognise faces but teach other crows who to be wary of. If you've made a crow angry, it hasn't forgotten." },
  { s:"A group of crows is officially called a 'murder'.", isTrue:true,  emoji:"🐦", cat:"Animals", exp:"The term dates back centuries, likely from folk tales about crows gathering when one of their own died — like a dark jury. Very gothic." },
  { s:"Cows have best friends and get stressed when separated from them.", isTrue:true,  emoji:"🐄", cat:"Animals", exp:"Research from Northampton University found cows have lower heart rates and less stress when paired with their preferred companion." },
  { s:"Penguins propose to their mates by presenting them with a carefully chosen pebble.", isTrue:true,  emoji:"🐧", cat:"Animals", exp:"For Gentoo and Adélie penguins, pebbles are serious currency. The male searches for the perfect one. If she accepts, it goes into the nest." },
  { s:"Turtles can breathe through their butts.", isTrue:true,  emoji:"🐢", cat:"Animals", exp:"It's called cloacal bursae breathing. In winter, freshwater turtles sit underwater and absorb oxygen through tissue near their tail end." },
  { s:"Rats laugh when you tickle them, but at a frequency too high for humans to hear.", isTrue:true,  emoji:"🐀", cat:"Animals", exp:"Neuroscientist Jaak Panksepp discovered this in 1999. Rats emit 50kHz chirps when tickled — outside human hearing range. They also seek out tickling." },
  { s:"Sharks are older than trees. They swam the oceans 50 million years before the first tree evolved.", isTrue:true,  emoji:"🦈", cat:"Animals", exp:"Sharks date back 450 million years. Trees only appeared about 360 million years ago. Sharks outlived the asteroid that killed the dinosaurs." },
  { s:"Squirrels forget where they buried about half their nuts every year.", isTrue:true,  emoji:"🐿️", cat:"Animals", exp:"Squirrels forget roughly 74% of their caches. Those forgotten nuts frequently grow into new trees, making squirrels one of nature's best tree planters." },
  { s:"Goldfish have a 3-second memory and forget what happened earlier the same minute.", isTrue:false, emoji:"🐟", cat:"Animals", exp:"Total myth! Goldfish can remember things for at least 3 months. They learn tricks, recognise their owners and anticipate feeding times. The 3-second thing was made up." },
  { s:"Bats are essentially blind and navigate entirely by sound.", isTrue:false, emoji:"🦇", cat:"Animals", exp:"Bats can see perfectly well — some species have excellent eyesight. Echolocation supplements their vision, especially in the dark. 'Blind as a bat' is nonsense." },
  { s:"Bulls charge at the colour red. That's why matadors use a red cape.", isTrue:false, emoji:"🐂", cat:"Animals", exp:"Cattle are red-green colourblind. Bulls react to the movement of the cape, not the colour. The cape is red to hide bloodstains. The bull would charge a beige one just as hard." },
  { s:"Chameleons change colour to camouflage themselves and blend into their surroundings.", isTrue:false, emoji:"🦎", cat:"Animals", exp:"Chameleons actually change colour to communicate — showing mood, regulating temperature, and signalling to other chameleons. Camouflage is a bonus, not the main function." },

  // ── SCIENCE ──
  { s:"The Eiffel Tower grows about 15 centimetres taller every summer due to heat expanding the metal.", isTrue:true,  emoji:"🗼", cat:"Science", exp:"Iron expands when heated. On a hot summer day, the Eiffel Tower's 7,300 tonnes of iron can expand by up to 15cm. In winter, it shrinks back." },
  { s:"A bolt of lightning is five times hotter than the surface of the Sun.", isTrue:true,  emoji:"⚡", cat:"Science", exp:"The Sun's surface is about 5,500°C. A lightning bolt can reach 30,000°C. The flash is so brief it doesn't ignite things, but it is scorching." },
  { s:"Bananas are technically berries. Strawberries, however, are not berries at all.", isTrue:true,  emoji:"🍌", cat:"Science", exp:"Botanically, a berry must develop from one flower with one ovary. Bananas qualify. Strawberries develop from multiple ovaries, making them 'accessory fruits'." },
  { s:"Humans share roughly 50% of their DNA with a banana.", isTrue:true,  emoji:"🧬", cat:"Science", exp:"About 50% of human DNA is shared with bananas. We share 85% with mice and 96% with chimps. Life on Earth is remarkably similar at the molecular level." },
  { s:"A day on Venus is longer than a year on Venus.", isTrue:true,  emoji:"🪐", cat:"Science", exp:"Venus rotates so slowly that one full spin (its day) takes 243 Earth days. But it orbits the Sun in just 225 Earth days. The year is shorter than the day." },
  { s:"There are more possible chess games than atoms in the entire observable universe.", isTrue:true,  emoji:"♟️", cat:"Science", exp:"The number of possible chess games (Shannon number) is roughly 10^120. The observable universe contains about 10^80 atoms. Chess wins by a cosmic margin." },
  { s:"The dot over the letter 'i' has an official name — it's called a 'tittle'.", isTrue:true,  emoji:"📝", cat:"Science", exp:"It's a real typographical term from Latin 'titulus'. The dot over 'j' is also a tittle. Knowing this wins zero arguments but is undeniably a fact." },
  { s:"You physically cannot hum while holding your nose closed.", isTrue:true,  emoji:"🤫", cat:"Science", exp:"Go ahead, try it. Humming requires air to flow through the nasal cavity. Block the nose and the sound stops immediately." },
  { s:"Alaska is simultaneously the easternmost, westernmost, AND northernmost U.S. state.", isTrue:true,  emoji:"🗺️", cat:"Science", exp:"Alaska's Aleutian Islands extend past the 180° meridian into the Eastern Hemisphere. This technically makes parts of Alaska further east than any other state, while also being furthest north and west." },
  { s:"Hot water can freeze faster than cold water under certain conditions.", isTrue:true,  emoji:"🧊", cat:"Science", exp:"The Mpemba Effect. Hot water can freeze faster due to convection currents, evaporation, and dissolved gases escaping. Still debated, but demonstrated in real experiments." },
  { s:"We only use about 10% of our brains. The rest just sits there doing nothing.", isTrue:false, emoji:"🧠", cat:"Science", exp:"Complete myth. Brain imaging shows virtually all areas are active almost all the time — even during sleep, most of the brain stays busy. 100% is in use." },
  { s:"Dropping a penny from the top of the Empire State Building could kill someone on the street.", isTrue:false, emoji:"🏢", cat:"Science", exp:"A penny is too light and flat. It tumbles in the air and reaches a terminal velocity of about 25–50 mph — enough to sting, but nowhere near enough to kill. Physics ruins movie myths." },
  { s:"Glass is actually a very slow-moving liquid — that's why old windows are thicker at the bottom.", isTrue:false, emoji:"🪟", cat:"Science", exp:"Glass is an amorphous solid, not a slow liquid. Old windows are thicker at the bottom because of old manufacturing techniques that made glass uneven — not because it flowed downward." },
  { s:"The Great Wall of China is visible to the naked eye from space.", isTrue:false, emoji:"🧱", cat:"Science", exp:"One of the most persistent myths. The Wall is far too narrow to see from low Earth orbit without optical aids. Multiple astronauts have confirmed this. The myth has been officially debunked." },
  { s:"Humans evolved directly from chimpanzees.", isTrue:false, emoji:"🐒", cat:"Science", exp:"Humans and chimps share a common ancestor, but we didn't evolve *from* chimps. Both species evolved separately from that ancestor. Chimps are our cousins, not our parents." },
  { s:"Cracking your knuckles will give you arthritis if you do it too much.", isTrue:false, emoji:"🤙", cat:"Science", exp:"Multiple studies disprove this. One doctor cracked knuckles on only one hand for 60 years and compared them — no difference. The sound is just gas bubbles popping in the joint fluid." },

  // ── HISTORY ──
  { s:"Cleopatra lived closer in time to the Moon landing than to the construction of the Great Pyramid.", isTrue:true,  emoji:"🔺", cat:"History", exp:"The Great Pyramid was built around 2560 BC. Cleopatra lived around 69 BC — over 2,400 years after. The Moon landing was 1969, only 2,038 years after Cleopatra. Time is humbling." },
  { s:"Oxford University is older than the Aztec Empire.", isTrue:true,  emoji:"🏛️", cat:"History", exp:"Oxford started teaching around 1096–1167 AD. The Aztec Empire was founded in 1428. Oxford was already 300+ years old before the Aztecs even existed." },
  { s:"Nintendo was originally founded as a playing card company — in 1889.", isTrue:true,  emoji:"🃏", cat:"History", exp:"Fusajiro Yamauchi founded Nintendo Koppai in Kyoto to make handmade playing cards. It stayed in cards for 70+ years before pivoting to toys, then video games in the 1970s." },
  { s:"Woolly mammoths were still alive when the Great Pyramid of Giza was being built.", isTrue:true,  emoji:"🦣", cat:"History", exp:"Most mammoths died out 10,000 years ago, but a dwarf population survived on Wrangel Island until about 1650 BC. The Great Pyramid was completed around 2560 BC — mammoths were still alive then." },
  { s:"The shortest war in history lasted just 38 to 45 minutes.", isTrue:true,  emoji:"⚔️", cat:"History", exp:"The Anglo-Zanzibar War of 1896. Britain issued an ultimatum; Zanzibar didn't comply. At 9:02am the British fleet opened fire. By 9:40am, Zanzibar had surrendered." },
  { s:"Napoleon Bonaparte was extremely short — only about 5 feet tall.", isTrue:false, emoji:"👨", cat:"History", exp:"Napoleon was actually 5'7\" (170cm) — average or even slightly above average for a French man of his era. The myth came from British propaganda and a mix-up between French and English inches." },
  { s:"In Mary Shelley's novel, Frankenstein is the name of the monster.", isTrue:false, emoji:"👹", cat:"History", exp:"Frankenstein is the name of the scientist — Victor Frankenstein. The creature is never given a name in the novel. Calling the monster Frankenstein is one of literature's most common mix-ups." },
  { s:"Mount Everest is the closest point on Earth to outer space.", isTrue:false, emoji:"🏔️", cat:"History", exp:"Because Earth bulges at the equator, Mount Chimborazo in Ecuador is about 2km closer to outer space than Everest. Everest is only tallest above sea level." },
  { s:"The Great Fire of London in 1666 killed thousands of people.", isTrue:false, emoji:"🔥", cat:"History", exp:"Remarkably, the Great Fire killed only 6 confirmed people despite destroying 13,200 houses and 87 churches. The medieval buildings burned fast but people had time to flee." },

  // ── FOOD ──
  { s:"Honey found inside Egyptian tombs is still perfectly edible after 3,000 years.", isTrue:true,  emoji:"🍯", cat:"Food", exp:"Honey is the only food that doesn't spoil. Its low moisture, acidic pH and hydrogen peroxide make it hostile to bacteria. Archaeologists have tasted 3,000-year-old tomb honey — it was fine." },
  { s:"Carrots were originally purple. The orange variety was bred in the Netherlands.", isTrue:true,  emoji:"🥕", cat:"Food", exp:"Wild carrots were originally purple, white, or yellow. Dutch growers in the 17th century cultivated orange carrots, possibly to honour the House of Orange. The orange carrot then took over the world." },
  { s:"Peanuts are not actually nuts — they're legumes, in the same family as beans and lentils.", isTrue:true,  emoji:"🥜", cat:"Food", exp:"Peanuts grow underground in pods, not on trees like true nuts. They're botanically a legume, making them closer to chickpeas than to almonds or walnuts." },
  { s:"Eating carrots improves your eyesight and can reverse poor vision.", isTrue:false, emoji:"👁️", cat:"Food", exp:"Carrots are rich in Vitamin A, which supports eye health. But if you're not deficient, eating more won't improve vision. The myth was partly British WWII propaganda to hide radar technology." },
  { s:"Sugar makes children hyperactive — this has been scientifically proven.", isTrue:false, emoji:"🍭", cat:"Food", exp:"Multiple double-blind studies found no link between sugar and hyperactivity in children. Parents perceive their kids as more energetic after sugar, but it's expectation bias. The science is clear." },
  { s:"Different zones of the tongue detect different tastes — sweet at front, bitter at back.", isTrue:false, emoji:"👅", cat:"Food", exp:"The 'tongue map' has been completely debunked. All taste buds across the tongue can detect all five tastes: sweet, sour, salty, bitter, and umami. The diagram was based on a mistranslation." },
  { s:"Chocolate was once used as currency by the Aztecs.", isTrue:true,  emoji:"🍫", cat:"Food", exp:"Cacao beans were so valuable to the Aztecs that they used them as currency. You could buy a turkey for 100 cacao beans. Chocolate was also a drink reserved for warriors and royalty." },
  { s:"Cucumbers are technically a fruit, not a vegetable.", isTrue:true,  emoji:"🥒", cat:"Food", exp:"Botanically, a fruit is the mature ovary of a flowering plant containing seeds. Cucumbers develop from flowers and contain seeds — so they're fruits. Same goes for tomatoes, peppers, and courgettes." },
];

const CATS = ['All','Animals','Science','History','Food'];
const CAT_EMOJIS = { All:'🎲', Animals:'🐾', Science:'🔬', History:'⏳', Food:'🍽️' };

let pool = [];
let used = 0;
let correct = 0;
let total = 0;
let current = null;
let voted = false;
let activeCat = 'All';

function init() {
  // Build category buttons
  const el = document.getElementById('cats');
  el.innerHTML = CATS.map(c => `
    <button class="cat-btn ${c === activeCat ? 'active' : ''}" onclick="selectCat('${c}')">
      ${CAT_EMOJIS[c]} ${c}
    </button>`).join('');
  buildPool();
  nextFact();
}

function selectCat(cat) {
  activeCat = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.toggle('active', b.textContent.trim().includes(cat)));
  buildPool();
  nextFact();
}

function buildPool() {
  const source = activeCat === 'All' ? FACTS : FACTS.filter(f => f.cat === activeCat);
  pool = shuffle([...source]);
  used = 0;
}

function nextFact() {
  if (used >= pool.length) buildPool(); // reshuffle when exhausted
  current = pool[used++];
  voted = false;

  document.getElementById('factCard').className = 'fact-card';
  document.getElementById('factEmoji').textContent = current.emoji;
  document.getElementById('factText').textContent = current.s;
  const catEl = document.getElementById('factCat');
  catEl.textContent = current.cat;
  catEl.style.display = 'inline-block';

  document.getElementById('btnTruth').className = 'btn-vote btn-truth';
  document.getElementById('btnLie').className   = 'btn-vote btn-lie';
  document.getElementById('revealPanel').className = 'reveal-panel';
  document.getElementById('btnNext').className = 'btn-next';
  updateCounter();
}

function vote(guessTrue) {
  if (voted) return;
  voted = true;
  total++;

  const isCorrect = guessTrue === current.isTrue;
  if (isCorrect) correct++;

  // Style chosen / dimmed buttons
  document.getElementById('btnTruth').className = 'btn-vote btn-truth' + (guessTrue  ? ' chosen' : ' dimmed');
  document.getElementById('btnLie').className   = 'btn-vote btn-lie'   + (!guessTrue ? ' chosen' : ' dimmed');

  // Fact card border
  document.getElementById('factCard').className = 'fact-card ' + (isCorrect ? 'correct' : 'wrong');

  // Reveal panel
  const panel = document.getElementById('revealPanel');
  const verdict = document.getElementById('verdict');
  const explanation = document.getElementById('explanation');

  if (isCorrect) {
    verdict.className = 'verdict v-correct';
    verdict.textContent = current.isTrue ? '✅ Correct — it\'s TRUE!' : '✅ Correct — it\'s a LIE!';
  } else {
    verdict.className = 'verdict v-wrong';
    verdict.textContent = current.isTrue ? '❌ Wrong — it was TRUE!' : '❌ Wrong — it was a LIE!';
  }
  explanation.textContent = current.exp;
  panel.className = 'reveal-panel show';

  document.getElementById('btnNext').className = 'btn-next show';
  updateCounter();
}

function updateCounter() {
  const el = document.getElementById('scoreChip');
  el.textContent = `${correct} / ${total}`;
  const counter = document.getElementById('counter');
  if (total > 0) {
    const pct = Math.round(correct / total * 100);
    counter.textContent = `${pct}% correct across ${total} fact${total !== 1 ? 's' : ''}`;
  } else {
    counter.textContent = '';
  }
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

init();
