<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Truth or Lie? 🤔</title>
<style>
  :root {
    --bg:     #0d0d1a;
    --card:   #1c1c38;
    --border: rgba(124,58,237,0.2);
    --purple: #7c3aed;
    --purple2:#a855f7;
    --amber:  #f59e0b;
    --green:  #10b981;
    --red:    #ef4444;
    --text:   #f1f5f9;
    --muted:  #94a3b8;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 60px;
  }
  .wrap { width: 100%; max-width: 540px; }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
  .logo { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
  .logo span { color: var(--purple2); }
  .score-pill {
    font-size: 13px; font-weight: 700;
    background: rgba(124,58,237,0.15);
    border: 1px solid rgba(124,58,237,0.3);
    color: var(--purple2);
    padding: 5px 14px; border-radius: 20px;
  }
  .cat-label {
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.1em; color: var(--muted); margin-bottom: 10px;
  }
  .cats { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
  .cat-btn {
    padding: 8px 16px; border-radius: 20px;
    border: 1.5px solid rgba(255,255,255,0.12);
    background: transparent; color: var(--muted);
    font-size: 14px; font-weight: 500; cursor: pointer;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
  }
  .cat-btn:hover { border-color: var(--purple); color: var(--text); }
  .cat-btn.active { background: var(--purple); border-color: var(--purple); color: #fff; font-weight: 600; }
  .fact-card {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 22px; padding: 26px 22px;
    margin-bottom: 16px; min-height: 170px;
    display: flex; flex-direction: column; justify-content: center;
    transition: border-color 0.35s;
  }
  .fact-card.is-correct { border-color: rgba(16,185,129,0.6); }
  .fact-card.is-wrong   { border-color: rgba(239,68,68,0.6); }
  .fact-emoji { font-size: 38px; margin-bottom: 14px; line-height: 1; }
  .fact-text  { font-size: clamp(16px, 4vw, 21px); font-weight: 700; line-height: 1.45; }
  .fact-tag {
    display: inline-block; margin-top: 14px;
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--purple2); background: rgba(124,58,237,0.1);
    padding: 4px 10px; border-radius: 20px;
  }
  .vote-row { display: flex; gap: 12px; margin-bottom: 14px; }
  .btn-truth, .btn-lie {
    flex: 1; padding: 18px 10px; border: none; border-radius: 16px;
    font-size: 18px; font-weight: 800; cursor: pointer;
    transition: transform 0.12s, box-shadow 0.2s, opacity 0.2s;
  }
  .btn-truth { background: var(--green); color: #fff; box-shadow: 0 0 24px rgba(16,185,129,0.2); }
  .btn-lie   { background: var(--red);   color: #fff; box-shadow: 0 0 24px rgba(239,68,68,0.2); }
  .btn-truth:hover { box-shadow: 0 0 40px rgba(16,185,129,0.4); }
  .btn-lie:hover   { box-shadow: 0 0 40px rgba(239,68,68,0.4); }
  .btn-truth:active, .btn-lie:active { transform: scale(0.95); }
  .btn-truth.chosen { transform: scale(1.04); box-shadow: 0 0 44px rgba(16,185,129,0.5); }
  .btn-lie.chosen   { transform: scale(1.04); box-shadow: 0 0 44px rgba(239,68,68,0.5); }
  .btn-truth.faded, .btn-lie.faded { opacity: 0.3; cursor: default; transform: scale(0.97); }
  .reveal {
    display: none;
    background: var(--card); border: 1.5px solid var(--border);
    border-radius: 18px; padding: 20px 20px; margin-bottom: 14px;
  }
  .reveal.show { display: block; animation: popUp 0.3s cubic-bezier(0.34,1.5,0.64,1); }
  @keyframes popUp {
    from { opacity: 0; transform: scale(0.95) translateY(8px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  .verdict { font-size: 24px; font-weight: 800; margin-bottom: 10px; }
  .verdict.correct { color: var(--green); }
  .verdict.wrong   { color: var(--red); }
  .explain {
    font-size: 14px; color: var(--muted); line-height: 1.65;
    padding-left: 14px; border-left: 3px solid var(--purple);
  }
  .btn-next {
    display: none; width: 100%; padding: 16px; border: none; border-radius: 16px;
    background: var(--purple); color: #fff;
    font-size: 16px; font-weight: 700; cursor: pointer;
    box-shadow: 0 0 24px rgba(124,58,237,0.3);
    transition: box-shadow 0.2s, transform 0.1s;
  }
  .btn-next:hover { box-shadow: 0 0 40px rgba(124,58,237,0.5); }
  .btn-next:active { transform: scale(0.97); }
  .btn-next.show { display: block; animation: fadeIn 0.25s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .tally { text-align: center; font-size: 13px; color: var(--muted); margin-top: 16px; }
  @media (max-width: 380px) {
    .btn-truth, .btn-lie { font-size: 15px; padding: 16px 8px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="logo">Truth or <span>Lie?</span> 🤔</div>
    <div class="score-pill" id="scorePill">0 / 0</div>
  </div>
  <div class="cat-label">Pick a category</div>
  <div class="cats" id="cats"></div>
  <div class="fact-card" id="factCard">
    <div class="fact-emoji" id="factEmoji">🎲</div>
    <div class="fact-text"  id="factText">Pick a category above to start!</div>
    <span class="fact-tag"  id="factTag"></span>
  </div>
  <div class="vote-row">
    <button class="btn-truth" id="btnTruth">✅ Truth</button>
    <button class="btn-lie"   id="btnLie">❌ Lie</button>
  </div>
  <div class="reveal" id="reveal">
    <div class="verdict" id="verdict"></div>
    <div class="explain" id="explain"></div>
  </div>
  <button class="btn-next" id="btnNext">Next Fact →</button>
  <div class="tally" id="tally"></div>
</div>
<script>
var FACTS = [
  { s:"Wombat poop is perfectly cube-shaped — it's the only animal that produces cube droppings.", isTrue:true,  e:"🐨", cat:"Animals", x:"Wombats produce about 80-100 cubes per night. Their elastic intestines create this shape so droppings don't roll off rocks." },
  { s:"Otters hold hands while sleeping so they don't drift apart from each other.", isTrue:true,  e:"🦦", cat:"Animals", x:"This is called rafting. They also wrap themselves in kelp as an anchor. Real, adorable, and scientifically documented." },
  { s:"Scotland's official national animal is a unicorn.", isTrue:true,  e:"🦄", cat:"Animals", x:"Since the 12th century! The unicorn symbolised power and independence in Celtic mythology. Scotland fully committed to the bit." },
  { s:"A group of flamingos is officially called a flamboyance.", isTrue:true,  e:"🦩", cat:"Animals", x:"Also called a stand or colony, but flamboyance is the official term. Perfectly on brand." },
  { s:"Butterflies taste everything they land on — including your skin — with their feet.", isTrue:true,  e:"🦋", cat:"Animals", x:"They have chemoreceptors on their feet, 200 times more sensitive than a human tongue. Hope you taste good." },
  { s:"Sloths can hold their breath longer than dolphins — up to 40 minutes.", isTrue:true,  e:"🦥", cat:"Animals", x:"By slowing their metabolism, sloths can hold their breath up to 40 minutes underwater. Dolphins max out at 10-15 minutes." },
  { s:"Male seahorses are the ones who get pregnant and give birth.", isTrue:true,  e:"🐠", cat:"Animals", x:"The female deposits eggs into a pouch on the male's belly. He carries them for 2-4 weeks and gives birth to hundreds of tiny seahorses." },
  { s:"An octopus has three hearts and its blood is blue.", isTrue:true,  e:"🐙", cat:"Animals", x:"Two hearts pump blood to the gills, one to the body. Their blood uses copper-based hemocyanin instead of iron-based hemoglobin — making it blue." },
  { s:"Crows can recognise individual human faces and hold grudges against people who upset them.", isTrue:true,  e:"🐦", cat:"Animals", x:"Studies show crows recognise faces and teach other crows who to avoid. If you've made a crow angry, it hasn't forgotten." },
  { s:"Cows have best friends and get stressed when separated from them.", isTrue:true,  e:"🐄", cat:"Animals", x:"Research from Northampton University found cows have lower heart rates and less stress when with their preferred companion." },
  { s:"Penguins propose to their mates by presenting a carefully chosen pebble.", isTrue:true,  e:"🐧", cat:"Animals", x:"For Gentoo and Adelie penguins, pebbles are serious currency. The male finds the best one and presents it. If she accepts, it goes into the nest." },
  { s:"Turtles can breathe through their butts.", isTrue:true,  e:"🐢", cat:"Animals", x:"It's called cloacal bursae breathing. In winter, freshwater turtles absorb oxygen through tissue near their tail end while sitting underwater." },
  { s:"Rats laugh when you tickle them, at a frequency too high for humans to hear.", isTrue:true,  e:"🐀", cat:"Animals", x:"Discovered in 1999. Rats emit 50kHz chirps when tickled — outside human hearing range. They also seek out tickling." },
  { s:"Sharks are older than trees — they swam the oceans millions of years before the first tree evolved.", isTrue:true,  e:"🦈", cat:"Animals", x:"Sharks date back 450 million years. Trees only appeared about 360 million years ago. Sharks outlived the dinosaur extinction." },
  { s:"Squirrels forget where they buried about half their nuts every year.", isTrue:true,  e:"🐿", cat:"Animals", x:"Squirrels forget roughly 74% of their caches. The forgotten nuts frequently grow into new trees — making squirrels great tree planters." },
  { s:"Goldfish have a 3-second memory.", isTrue:false, e:"🐟", cat:"Animals", x:"Total myth. Goldfish can remember things for at least 3 months, learn tricks, recognise owners, and anticipate feeding times." },
  { s:"Bats are essentially blind and navigate entirely by sound.", isTrue:false, e:"🦇", cat:"Animals", x:"Bats can see perfectly well — some have excellent eyesight. Echolocation supplements vision in the dark. Blind as a bat is nonsense." },
  { s:"Bulls charge at red because it angers them — that's why matadors use a red cape.", isTrue:false, e:"🐂", cat:"Animals", x:"Cattle are red-green colourblind. Bulls react to the cape's movement, not its colour. A beige cape works just as well." },
  { s:"Chameleons change colour to blend into their surroundings as camouflage.", isTrue:false, e:"🦎", cat:"Animals", x:"Chameleons change colour mainly to communicate mood and regulate temperature. Camouflage is a bonus, not the main purpose." },
  { s:"The Eiffel Tower grows about 15 cm taller every summer due to the heat expanding the metal.", isTrue:true,  e:"🗼", cat:"Science", x:"Iron expands when heated. On hot summer days, the Eiffel Tower can expand by up to 15cm. It shrinks back in winter." },
  { s:"A bolt of lightning is five times hotter than the surface of the Sun.", isTrue:true,  e:"⚡", cat:"Science", x:"The Sun's surface is about 5,500C. A lightning bolt reaches 30,000C. The flash is brief, but it's scorching." },
  { s:"Bananas are technically berries. Strawberries are not.", isTrue:true,  e:"🍌", cat:"Science", x:"Botanically, a berry develops from one flower with one ovary. Bananas qualify. Strawberries develop from multiple ovaries — they're accessory fruits, not berries." },
  { s:"Humans share about 50% of their DNA with a banana.", isTrue:true,  e:"🧬", cat:"Science", x:"About 50% of human DNA matches bananas. We share 85% with mice, 96% with chimps. Life on Earth is remarkably similar at the molecular level." },
  { s:"A day on Venus is longer than a year on Venus.", isTrue:true,  e:"🪐", cat:"Science", x:"Venus rotates so slowly that one full spin takes 243 Earth days. But it orbits the Sun in just 225 Earth days. The year is shorter than the day." },
  { s:"There are more possible chess games than atoms in the entire observable universe.", isTrue:true,  e:"♟", cat:"Science", x:"The number of possible chess games is roughly 10 to the power of 120. The observable universe has about 10 to the power of 80 atoms. Chess wins by a cosmic margin." },
  { s:"The dot over the letter i has an official name — it's called a tittle.", isTrue:true,  e:"📝", cat:"Science", x:"It's a real typographical term from Latin. The dot over j is also a tittle." },
  { s:"You cannot hum while holding your nose closed.", isTrue:true,  e:"🤫", cat:"Science", x:"Try it. Humming requires air to flow through the nasal cavity. Block the nose and the sound stops completely." },
  { s:"Alaska is simultaneously the easternmost, westernmost, and northernmost US state.", isTrue:true,  e:"🗺", cat:"Science", x:"Alaska's Aleutian Islands extend past the 180-degree meridian into the Eastern Hemisphere — making parts of Alaska further east than any other state, while also being furthest north and west." },
  { s:"We only use about 10% of our brains.", isTrue:false, e:"🧠", cat:"Science", x:"Complete myth. Brain imaging shows virtually all areas are active almost all the time, even during sleep. 100% is in regular use." },
  { s:"Dropping a penny from the Empire State Building could kill someone below.", isTrue:false, e:"🏢", cat:"Science", x:"A penny is too light and flat. It tumbles and reaches terminal velocity of 25-50 mph — enough to sting at most. Physics ruins movie myths." },
  { s:"Glass is a very slow-moving liquid — that's why old windows are thicker at the bottom.", isTrue:false, e:"🪟", cat:"Science", x:"Glass is an amorphous solid, not a slow liquid. Old windows are thicker at the bottom due to manufacturing techniques of the era, not because glass flowed downward." },
  { s:"The Great Wall of China is visible from space with the naked eye.", isTrue:false, e:"🧱", cat:"Science", x:"The wall is far too narrow to see from orbit without aids. Multiple astronauts have confirmed this." },
  { s:"Humans evolved directly from chimpanzees.", isTrue:false, e:"🐒", cat:"Science", x:"Humans and chimps share a common ancestor but evolved separately from it. Chimps are our cousins, not our parents." },
  { s:"Cracking your knuckles causes arthritis.", isTrue:false, e:"🤙", cat:"Science", x:"Multiple studies disprove this. One doctor cracked knuckles on only one hand for 60 years and compared them — no difference." },
  { s:"Cleopatra lived closer in time to the Moon landing than to the building of the Great Pyramid.", isTrue:true,  e:"🔺", cat:"History", x:"The Great Pyramid was built around 2560 BC. Cleopatra lived around 69 BC. The Moon landing was 1969, only 2,038 years after Cleopatra. Time is humbling." },
  { s:"Oxford University is older than the Aztec Empire.", isTrue:true,  e:"🏛", cat:"History", x:"Oxford started teaching around 1096-1167 AD. The Aztec Empire was founded in 1428. Oxford was already 300 years old before the Aztecs even existed." },
  { s:"Nintendo was originally a playing card company, founded in 1889.", isTrue:true,  e:"🃏", cat:"History", x:"Fusajiro Yamauchi founded Nintendo Koppai in Kyoto to make handmade playing cards. It stayed in cards for 70+ years before pivoting to video games." },
  { s:"Woolly mammoths were still alive when the Great Pyramid of Giza was being built.", isTrue:true,  e:"🦣", cat:"History", x:"Most mammoths died out 10,000 years ago, but a dwarf population survived on Wrangel Island until about 1650 BC. The Great Pyramid was finished around 2560 BC." },
  { s:"The shortest war in history lasted between 38 and 45 minutes.", isTrue:true,  e:"⚔", cat:"History", x:"The Anglo-Zanzibar War of 1896. Britain issued an ultimatum. At 9:02am the fleet opened fire. By 9:40am, Zanzibar had surrendered." },
  { s:"Napoleon Bonaparte was only about 5 feet tall.", isTrue:false, e:"👨", cat:"History", x:"Napoleon was actually 5 foot 7 — average for a French man of his era. The myth came from British propaganda and a confusion between French and English inches." },
  { s:"In Mary Shelley's novel, Frankenstein is the name of the monster.", isTrue:false, e:"👹", cat:"History", x:"Frankenstein is the scientist — Victor Frankenstein. The creature is never named in the novel." },
  { s:"Mount Everest is the closest point on Earth to outer space.", isTrue:false, e:"🏔", cat:"History", x:"Because Earth bulges at the equator, Mount Chimborazo in Ecuador is about 2km closer to space than Everest. Everest is only the tallest above sea level." },
  { s:"The Great Fire of London in 1666 killed thousands of people.", isTrue:false, e:"🔥", cat:"History", x:"Remarkably, the Great Fire killed only 6 confirmed people despite destroying 13,200 houses and 87 churches. People had time to flee." },
  { s:"Honey from Egyptian tombs is still edible after 3,000 years.", isTrue:true,  e:"🍯", cat:"Food", x:"Honey never spoils. Its low moisture, acidic pH, and hydrogen peroxide make it hostile to bacteria. Archaeologists have tasted 3,000-year-old tomb honey — it was fine." },
  { s:"Carrots were originally purple. The orange variety was bred later in the Netherlands.", isTrue:true,  e:"🥕", cat:"Food", x:"Wild carrots were originally purple, white, or yellow. Dutch growers in the 17th century cultivated orange ones, possibly to honour the House of Orange." },
  { s:"Peanuts are not actually nuts — they're legumes, related to beans and lentils.", isTrue:true,  e:"🥜", cat:"Food", x:"Peanuts grow underground in pods, not on trees like true nuts. They're botanically a legume, closer to chickpeas than almonds." },
  { s:"Chocolate was used as currency by the Aztecs.", isTrue:true,  e:"🍫", cat:"Food", x:"Cacao beans were so valuable to the Aztecs they used them as money. You could buy a turkey for 100 beans." },
  { s:"Cucumbers are technically a fruit, not a vegetable.", isTrue:true,  e:"🥒", cat:"Food", x:"Botanically, a fruit is a mature ovary of a flowering plant containing seeds. Cucumbers have seeds and develop from flowers. Same goes for tomatoes and peppers." },
  { s:"Eating carrots improves your eyesight and can reverse poor vision.", isTrue:false, e:"👁", cat:"Food", x:"Carrots have Vitamin A which supports eye health — but only if you're deficient. Eating more won't improve normal vision. The myth was partly WWII propaganda." },
  { s:"Sugar makes children hyperactive — science has proven this.", isTrue:false, e:"🍭", cat:"Food", x:"Multiple double-blind studies found zero link between sugar and hyperactivity. It's expectation bias. The science is definitive." },
  { s:"Different parts of your tongue detect different tastes — sweet at the front, bitter at the back.", isTrue:false, e:"👅", cat:"Food", x:"The tongue map has been completely debunked. All taste buds detect all five tastes. The diagram in textbooks was based on a mistranslation." },
  { s:"Your stomach replaces its entire inner lining every 3 to 4 days, otherwise it would digest itself.", isTrue:true,  e:"🫃", cat:"Human Body", x:"Stomach acid is strong enough to dissolve metal. The stomach rebuilds its mucous lining every 3-4 days. Without this, it would eat through itself." },
  { s:"Your nose can detect over 1 trillion different smells.", isTrue:true,  e:"👃", cat:"Human Body", x:"A 2014 Rockefeller University study found humans detect at least 1 trillion distinct scents — far more than the long-cited figure of 10,000." },
  { s:"The human eye can distinguish about 10 million different colours.", isTrue:true,  e:"👁", cat:"Human Body", x:"The eye has 6-7 million cone cells for colour detection. Combined, they let us see roughly 10 million distinct shades." },
  { s:"Your heart beats roughly 100,000 times every single day.", isTrue:true,  e:"❤", cat:"Human Body", x:"At 70 beats per minute, that's 100,800 beats per day, 36.5 million per year, over 2.5 billion in a lifetime. The heart never takes a break." },
  { s:"Humans are the only animals that blush.", isTrue:true,  e:"😳", cat:"Human Body", x:"Charles Darwin called blushing the most peculiar and most human of all expressions. No other animal is known to blush in response to social emotions." },
  { s:"Your left lung is smaller than your right lung to make room for your heart.", isTrue:true,  e:"🫁", cat:"Human Body", x:"The left lung has 2 lobes, the right has 3. The left has a notch called the cardiac notch — carved out to fit the heart. Efficient design." },
  { s:"The strongest muscle in the body, relative to its size, is the tongue.", isTrue:true,  e:"👅", cat:"Human Body", x:"The tongue is 8 interwoven muscles that never tire. Relative to size, it's the hardest-working muscle — used for eating, speaking, and swallowing every day." },
  { s:"Humans shed their entire outer skin layer every 2 to 4 weeks.", isTrue:true,  e:"🧴", cat:"Human Body", x:"You lose 30,000-40,000 dead skin cells every hour. The epidermis fully replaces itself every 2-4 weeks. A significant portion of household dust is dead human skin." },
  { s:"Your blood vessels, laid end to end, would circle the Earth about 2.5 times.", isTrue:true,  e:"🩸", cat:"Human Body", x:"The body has roughly 100,000 km of blood vessels combined. Earth's circumference is 40,000 km. That's 2.5 laps of the planet inside one body." },
  { s:"Your brain is about 73% water, and just 2% dehydration can noticeably impair memory and focus.", isTrue:true,  e:"💧", cat:"Human Body", x:"Even mild dehydration of 1-2% of body weight affects cognitive performance, mood, and memory. Staying hydrated is literally brain maintenance." },
  { s:"Humans have a diving reflex — cold water on the face automatically slows your heart rate.", isTrue:true,  e:"🏊", cat:"Human Body", x:"The mammalian dive reflex slows the heart and redirects blood to vital organs. We share it with dolphins and seals." },
  { s:"Humans are the only animals that can throw objects with power and accuracy.", isTrue:true,  e:"🤾", cat:"Human Body", x:"Our shoulder anatomy and wrist flexibility is unique. Chimps barely throw at 20 mph. Humans can exceed 90 mph. This was key to our survival as hunters." },
  { s:"The human body has exactly 206 bones from birth — that number never changes.", isTrue:false, e:"🦴", cat:"Human Body", x:"Babies are born with around 270-300 bones. Many fuse as you grow, leaving adults with 206. You effectively lose about 90 bones growing up." },
  { s:"Hair and fingernails continue to grow after death.", isTrue:false, e:"💅", cat:"Human Body", x:"Complete myth. Growth requires hormones and cellular energy — both stop at death. What happens is skin dehydrates and retracts, making nails and stubble appear longer." },
  { s:"The human brain is fully mature by age 18.", isTrue:false, e:"🧠", cat:"Human Body", x:"The prefrontal cortex doesn't fully mature until around 25. This is why teenagers make questionable choices. Science backs it up." },
  { s:"The human body has exactly 5 senses: sight, hearing, smell, taste, and touch.", isTrue:false, e:"🤲", cat:"Human Body", x:"Humans have at least 9 commonly accepted senses — including proprioception, balance, temperature, pain, and interoception. The 5-sense rule is a simplification." },
  { s:"The appendix is completely useless — a leftover from evolution with no function.", isTrue:false, e:"🤒", cat:"Human Body", x:"Research suggests the appendix acts as a safe house for beneficial gut bacteria, helping repopulate the gut after illness. Probably not useless after all." }
];
var CATS = ['All','Animals','Science','History','Food','Human Body'];
var CAT_EMOJIS = { All:'🎲', Animals:'🐾', Science:'🔬', History:'⏳', Food:'🍽', 'Human Body':'🫀' };
var pool=[], used=0, correct=0, total=0, current=null, voted=false, activeCat='All';
var elCats=document.getElementById('cats'), elCard=document.getElementById('factCard'), elEmoji=document.getElementById('factEmoji'), elText=document.getElementById('factText'), elTag=document.getElementById('factTag'), elTruth=document.getElementById('btnTruth'), elLie=document.getElementById('btnLie'), elReveal=document.getElementById('reveal'), elVerdict=document.getElementById('verdict'), elExplain=document.getElementById('explain'), elNext=document.getElementById('btnNext'), elScore=document.getElementById('scorePill'), elTally=document.getElementById('tally');
CATS.forEach(function(cat){
  var btn=document.createElement('button');
  btn.className='cat-btn'+(cat===activeCat?' active':'');
  btn.textContent=CAT_EMOJIS[cat]+' '+cat;
  btn.addEventListener('click',function(){selectCat(cat);});
  elCats.appendChild(btn);
});
elTruth.addEventListener('click',function(){vote(true);});
elLie.addEventListener('click',function(){vote(false);});
elNext.addEventListener('click',nextFact);
function selectCat(cat){
  activeCat=cat;
  var btns=elCats.querySelectorAll('.cat-btn');
  btns.forEach(function(b,i){b.classList.toggle('active',CATS[i]===cat);});
  buildPool(); nextFact();
}
function buildPool(){
  var source=activeCat==='All'?FACTS:FACTS.filter(function(f){return f.cat===activeCat;});
  pool=shuffle(source.slice()); used=0;
}
function nextFact(){
  if(used>=pool.length)buildPool();
  current=pool[used++]; voted=false;
  elCard.className='fact-card'; elEmoji.textContent=current.e; elText.textContent=current.s; elTag.textContent=current.cat;
  elTruth.className='btn-truth'; elLie.className='btn-lie'; elReveal.className='reveal'; elNext.className='btn-next';
}
function vote(guessTrue){
  if(voted)return; voted=true; total++;
  var ok=(guessTrue===current.isTrue); if(ok)correct++;
  elTruth.className='btn-truth'+(guessTrue?' chosen':' faded');
  elLie.className='btn-lie'+(!guessTrue?' chosen':' faded');
  elCard.className='fact-card '+(ok?'is-correct':'is-wrong');
  elVerdict.className='verdict '+(ok?'correct':'wrong');
  elVerdict.textContent=ok?(current.isTrue?'✅ Correct — it\'s TRUE!':'✅ Correct — it\'s a LIE!'):(current.isTrue?'❌ Wrong — it was TRUE!':'❌ Wrong — it was a LIE!');
  elExplain.textContent=current.x; elReveal.className='reveal show'; elNext.className='btn-next show';
  elScore.textContent=correct+' / '+total;
  elTally.textContent=Math.round(correct/total*100)+'% correct across '+total+' fact'+(total!==1?'s':'');
}
function shuffle(arr){
  for(var i=arr.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t;}
  return arr;
}
buildPool(); nextFact();
</script>
